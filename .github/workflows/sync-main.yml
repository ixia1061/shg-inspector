name: develop를 main에 자동 병합

# develop에 푸시될 때마다 main으로 자동 병합·푸시한다(운영 자동 배포).
# 이 파일이 생기기 전까지는 develop -> main 병합을 사람이 직접 해야 했고,
# 깜빡하면 develop의 수정사항이 운영(main, Vercel Production)에는 전혀
# 반영되지 않은 채로 프리뷰에서만 "고쳤다"고 착각하는 사고가 났다.
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: write

# develop에 짧은 간격으로 커밋이 연달아 푸시되면(하루에 배포가 여러 번 이어지는
# 날 흔함) 두 실행이 동시에 main을 체크아웃해 각자 병합·푸시를 시도할 수 있다.
# 먼저 끝난 쪽만 성공하고 나중 실행은 non-fast-forward로 조용히 실패해,
# 이 워크플로우로 없애려던 "병합 누락" 문제가 형태만 바뀌어 재발할 수 있어
# 동시 실행 대신 순서대로 대기시킨다(대기 중인 실행이 새로 들어오면 어차피
# 다시 최신 main을 체크아웃하므로 취소하지 않고 큐에 쌓아 전부 반영한다).
concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: main 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: develop 병합
        run: |
          git fetch origin develop
          git merge origin/develop --no-edit

      - name: main 푸시
        run: git push origin main
