name: Supabase Keep-alive

# Supabase 무료 플랜은 7일간 API 활동이 없으면 프로젝트가 자동 일시정지된다.
# 점검 특성상 월초에 몰아 쓰고 중순~월말엔 접속이 뜸해 이 조건에 걸리기 쉬우므로,
# 3일 간격으로 REST API에 가벼운 조회 요청을 보내 활동 신호를 유지한다.
on:
  schedule:
    - cron: "0 3 */3 * *" # UTC 03:00, 3일 간격(월 경계 최악의 경우에도 7일 미만 간격 유지)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            "${SUPABASE_URL}/rest/v1/sites?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
