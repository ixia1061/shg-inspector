name: Supabase Keep-alive

# Supabase 무료 플랜은 "일주일간 충분한 활동이 없으면" 프로젝트가 자동 일시정지된다.
# 점검 특성상 월초에 몰아 쓰고 중순~월말엔 접속이 뜸해 이 조건에 걸리기 쉬워
# 3일 간격으로 이 워크플로우를 돌렸었는데(2026-08-21), 그런데도 2026-09-25에 실제로 정지됨 —
# Supabase의 비활동 판정 기준이 "7일 내 요청 1건이라도 있었는지"가 아니라
# "일주일 동안 매일 어느 정도의 실제 DB 활동이 있었는지"였던 것으로 보여, 3일에 1건은 기준 미달이었다.
# 그래서 매일 1회로 주기를 좁힌다.
on:
  schedule:
    - cron: "0 3 * * *" # 매일 UTC 03:00(KST 정오)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            "${SUPABASE_URL}/rest/v1/sites?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
